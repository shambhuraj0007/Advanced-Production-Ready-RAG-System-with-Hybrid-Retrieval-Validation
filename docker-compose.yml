version: '3.8'

services:
  rag-microservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: advanced_rag_system
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    volumes:
      - rag_data:/app/chroma_db
    restart: unless-stopped

volumes:
  rag_data:
